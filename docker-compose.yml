name: marketdata

x-app: &app
  env_file:
    - path: .env
      required: false
  restart: unless-stopped

# Two identical ingesters feed the same topics; the writer drops the copies.
# Restart them one at a time (make deploy-ingesters) and no trade is lost.
x-ingester: &ingester
  <<: *app
  image: marketdata-ingester:dev
  build:
    context: .
    target: ingester
    args:
      VERSION: ${VERSION:-dev}
  depends_on:
    kafka-init:
      condition: service_completed_successfully
  healthcheck:
    # Ready = every feed connected and streaming. Runs the binary itself:
    # the distroless image has no shell or curl.
    test: ["CMD", "/app", "healthcheck"]
    interval: 5s
    timeout: 4s
    retries: 3
    start_period: 30s

services:
  ingester-a:
    <<: *ingester
    environment:
      PUBLISHER: kafka
      KAFKA_BROKERS: kafka:29092
      INGESTER_ID: ingester-a

  ingester-b:
    <<: *ingester
    environment:
      PUBLISHER: kafka
      KAFKA_BROKERS: kafka:29092
      INGESTER_ID: ingester-b

  writer:
    <<: *app
    image: marketdata-writer:dev
    build:
      context: .
      target: writer
      args:
        VERSION: ${VERSION:-dev}
    environment:
      KAFKA_BROKERS: kafka:29092
      CLICKHOUSE_ADDR: clickhouse:9000
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  aggregator:
    <<: *app
    image: marketdata-aggregator:dev
    build:
      context: .
      target: aggregator
      args:
        VERSION: ${VERSION:-dev}
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  alerts:
    <<: *app
    image: marketdata-alerts:dev
    build:
      context: .
      target: alerts
      args:
        VERSION: ${VERSION:-dev}
    ports:
      - "8091:8091" # rules API
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Cross-exchange spreads of the same asset (BTC-USD vs BTC-USDT ...) from
  # md.books: snapshots to md.arb, closed opportunities to md.arb-windows,
  # alerts to md.alerts.
  arbitrage:
    <<: *app
    image: marketdata-arbitrage:dev
    build:
      context: .
      target: arbitrage
      args:
        VERSION: ${VERSION:-dev}
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Web UI + history API; proxies /ws to the gateway and /api/rules to alerts.
  api:
    <<: *app
    image: marketdata-api:dev
    build:
      context: .
      target: api
      args:
        VERSION: ${VERSION:-dev}
    ports:
      - "8088:8088"
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
      KAFKA_BROKERS: kafka:29092
      API_GATEWAY_URL: http://gateway:8090
      API_ALERTS_URL: http://alerts:8091
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  gateway:
    <<: *app
    image: marketdata-gateway:dev
    build:
      context: .
      target: gateway
      args:
        VERSION: ${VERSION:-dev}
    ports:
      - "8090:8090"
      - "9104:9104" # metrics + pprof
    environment:
      KAFKA_BROKERS: kafka:29092
    ulimits:
      nofile: { soft: 1048576, hard: 1048576 }
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Pipeline benchmark (make bench-pipeline): a writer and an aggregator on
  # their own topics (bench.*), consumer groups and ClickHouse database, fed
  # by replay with stored trades. Not started by default.
  bench-writer:
    <<: *app
    image: marketdata-writer:dev
    profiles: ["bench"]
    restart: "no"
    environment: &bench-env
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_TRADES: bench.trades
      KAFKA_TOPIC_GAPS: bench.gaps
      KAFKA_TOPIC_CANDLES: bench.candles
      KAFKA_TOPIC_ALERTS: bench.alerts
      KAFKA_TOPIC_BOOKS: bench.books
      KAFKA_TOPIC_ARB_WINDOWS: bench.arb-windows
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: bench
      WRITER_CONSUMER_GROUP: bench-writer
      WRITER_BATCH_SIZE: ${BENCH_WRITER_BATCH:-10000}
      AGG_CONSUMER_GROUP: bench-aggregator

  bench-aggregator:
    <<: *app
    image: marketdata-aggregator:dev
    profiles: ["bench"]
    restart: "no"
    environment: *bench-env

  replay:
    image: marketdata-replay:dev
    build:
      context: .
      target: replay
      args:
        VERSION: ${VERSION:-dev}
    profiles: ["bench"]
    environment:
      KAFKA_BROKERS: kafka:29092
      CLICKHOUSE_ADDR: clickhouse:9000

  # Load generator, not started by default: make load LOAD_CONNS=20000 LOAD_REPLICAS=2
  # One container reaches ~28k connections to a single gateway port (ephemeral
  # ports per source IP); scale replicas for more.
  loadgen:
    image: marketdata-loadgen:dev
    build:
      context: .
      target: loadgen
      args:
        VERSION: ${VERSION:-dev}
    profiles: ["load"]
    command: ["-url", "ws://gateway:8090/ws", "-conns", "${LOAD_CONNS:-10000}", "-rate", "${LOAD_RATE:-1000}",
              "-trades", "${LOAD_TRADES_SHARE:-0.1}", "-duration", "${LOAD_DURATION:-2m}"]
    ulimits:
      nofile: { soft: 1048576, hard: 1048576 }
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65000"

  # Applies every migration in order. Migrations must be idempotent
  # (IF NOT EXISTS / OR REPLACE), so this runs safely on every `up`.
  migrate:
    image: clickhouse/clickhouse-server:25.8
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./migrations/clickhouse:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until clickhouse-client --host clickhouse --user "$${CLICKHOUSE_USER:-marketdata}" --password "$${CLICKHOUSE_PASSWORD:-marketdata}" --query "SELECT 1" >/dev/null 2>&1; do
          echo "waiting for clickhouse"; sleep 2
        done
        for f in /migrations/*.sql; do
          echo "applying $$f"
          clickhouse-client --host clickhouse --user "$${CLICKHOUSE_USER:-marketdata}" --password "$${CLICKHOUSE_PASSWORD:-marketdata}" --multiquery < "$$f"
        done
    env_file:
      - path: .env
        required: false
    restart: "no"

  kafka:
    image: apache/kafka:4.1.0
    # Come back after an OOM kill (e.g. during a parallel image build on a
    # small Docker VM); dependants reconnect on their own.
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # The image defaults to /tmp/kraft-combined-logs inside the container:
      # data would survive a restart but not a recreate (config change, image
      # update). Keep it on the volume.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Topics are infrastructure: created explicitly, never auto-created by clients.
  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:29092
        # Wait for the broker even when started without depends_on ordering
        # (e.g. "Start" in Docker Desktop = docker compose start).
        until $$T --bootstrap-server $$B --list >/dev/null 2>&1; do echo "waiting for kafka"; sleep 2; done
        $$T --bootstrap-server $$B --create --if-not-exists --topic md.trades --partitions 12 --replication-factor 1 --config retention.ms=604800000
        $$T --bootstrap-server $$B --create --if-not-exists --topic md.gaps --partitions 1 --replication-factor 1 --config retention.ms=604800000
        $$T --bootstrap-server $$B --create --if-not-exists --topic md.candles --partitions 12 --replication-factor 1 --config retention.ms=2592000000
        $$T --bootstrap-server $$B --create --if-not-exists --topic md.alerts --partitions 12 --replication-factor 1 --config retention.ms=604800000
        # Rules are state, not a stream: compaction keeps the latest version
        # of each rule (and drops tombstoned ones) forever.
        $$T --bootstrap-server $$B --create --if-not-exists --topic md.alert-rules --partitions 1 --replication-factor 1 --config cleanup.policy=compact
        $$T --bootstrap-server $$B --create --if-not-exists --topic md.subscriptions --partitions 1 --replication-factor 1 --config cleanup.policy=compact
        $$T --bootstrap-server $$B --create --if-not-exists --topic md.settings --partitions 1 --replication-factor 1 --config cleanup.policy=compact
        # Book snapshots go stale in seconds: keep an hour for replays/debugging.
        $$T --bootstrap-server $$B --create --if-not-exists --topic md.books --partitions 12 --replication-factor 1 --config retention.ms=3600000
        # Cross-exchange snapshots are as short-lived as books; closed
        # opportunity windows are kept a month (ClickHouse keeps 90 days).
        $$T --bootstrap-server $$B --create --if-not-exists --topic md.arb --partitions 3 --replication-factor 1 --config retention.ms=3600000
        $$T --bootstrap-server $$B --create --if-not-exists --topic md.arb-windows --partitions 3 --replication-factor 1 --config retention.ms=2592000000
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped # as kafka
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: marketdata
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-marketdata}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-marketdata}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      # Local dev only: open dashboards without login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  kafka-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
