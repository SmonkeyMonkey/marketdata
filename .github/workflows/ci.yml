name: ci

on:
  # Branches are checked through their pull request; main after each merge.
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR (or main) cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # github-actions format: one collapsible group per package and an
      # annotation on every failed test, shown on the PR.
      - run: make test GOTESTSUM_FORMAT=github-actions JUNIT=unit.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: unit.xml
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: marketdata
          CLICKHOUSE_PASSWORD: marketdata
        ports:
          - 9000:9000
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-integration GOTESTSUM_FORMAT=github-actions JUNIT=integration.xml
        env:
          CLICKHOUSE_ADDR: localhost:9000
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: integration.xml
          if-no-files-found: ignore

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make vuln

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Every service image, from docker-compose.yml, with layers cached between
  # runs in the GitHub Actions cache.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build images
        run: >-
          docker buildx bake -f docker-compose.yml
          --set '*.cache-from=type=gha'
          --set '*.cache-to=type=gha,mode=max'
          --set '*.output=type=cacheonly'
        env:
          VERSION: ${{ github.sha }}

  # The one check branch protection requires: green only if everything above
  # is, so jobs can be added or renamed without touching repository settings.
  test:
    if: always()
    needs: [lint, unit, integration, vuln, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - name: all checks passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
