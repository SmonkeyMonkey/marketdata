syntax = "proto3";

package marketdata.v1;

option go_package = "marketdata/internal/gen/marketdata/v1;marketdatav1";

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

// Trade is a single execution. Decimal values are strings so they stay exact
// regardless of an exchange's precision. Times are Unix nanoseconds (UTC).
message Trade {
  string exchange = 1;
  // Canonical BASE-QUOTE, e.g. BTC-USD.
  string symbol = 2;
  string trade_id = 3;
  string price = 4;
  string size = 5;
  Side taker_side = 6;
  int64 exchange_time_unix_nano = 7;
  int64 receive_time_unix_nano = 8;
  // Historical trade replayed on subscribe, not a live one.
  bool snapshot = 9;
}

// Candle is an OHLCV bar of one symbol on one exchange over
// [start, start + interval). Volumes are in base units; VWAP is
// quote_volume / volume.
message Candle {
  string exchange = 1;
  string symbol = 2;
  int64 interval_ms = 3;
  int64 start_unix_nano = 4;
  string open = 5;
  string high = 6;
  string low = 7;
  string close = 8;
  string volume = 9;
  string quote_volume = 10;
  string buy_volume = 11;
  string sell_volume = 12;
  int64 trades = 13;
  string first_trade_id = 14;
  string last_trade_id = 15;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  // Fires on the first trade at or above the price.
  DIRECTION_ABOVE = 1;
  // Fires on the first trade at or below the price.
  DIRECTION_BELOW = 2;
}

// AlertRule is a one-shot user price alert. Rules live in a compacted topic
// keyed by id; deleting or firing a rule writes a tombstone.
message AlertRule {
  string id = 1;
  string exchange = 2;
  string symbol = 3;
  Direction direction = 4;
  string price = 5;
  int64 created_unix_nano = 6;
  string note = 7;
}

enum AlertType {
  ALERT_TYPE_UNSPECIFIED = 0;
  ALERT_TYPE_PRICE_RULE = 1;
  ALERT_TYPE_WHALE_TRADE = 2;
  ALERT_TYPE_PRICE_MOVE = 3;
  ALERT_TYPE_ARBITRAGE = 4;
}

// Alert is a fired alert. id is deterministic, so a replay after a crash
// produces the same id and consumers can drop the duplicate.
message Alert {
  string id = 1;
  AlertType type = 2;
  string exchange = 3;
  string symbol = 4;
  string message = 5;
  string price = 6;
  int64 time_unix_nano = 7;
  string rule_id = 8;
  string trade_id = 9;
  string notional = 10;
  string change_pct = 11;
  int64 window_ms = 12;
}

// Subscription is a market the ingesters stream. Subscriptions live in a
// compacted topic keyed by exchange:symbol; removing one writes a tombstone.
// Pinned subscriptions come from ingester configuration and cannot be
// removed through the API.
message Subscription {
  string exchange = 1;
  string symbol = 2;
  bool pinned = 3;
  int64 created_unix_nano = 4;
}

// MarketSettings holds per-market alert settings in a compacted topic keyed
// by exchange:symbol; the key "*" (empty exchange and symbol) is the
// default for markets without their own record.
message MarketSettings {
  string exchange = 1;
  string symbol = 2;
  // Whale trade threshold: price * size in the quote currency.
  string whale_notional = 3;
  int64 updated_unix_nano = 4;
}

message BookLevel {
  string price = 1;
  string size = 2;
}

// Book is a snapshot of the top of one market's L2 order book, best levels
// first. Published at most every ~100 ms per market.
message Book {
  string exchange = 1;
  string symbol = 2;
  repeated BookLevel bids = 3;
  repeated BookLevel asks = 4;
  int64 exchange_time_unix_nano = 5;
  int64 receive_time_unix_nano = 6;
  // Exchange update id when available (Binance), for ordering; 0 otherwise.
  int64 seq = 7;
}

// Gap reports trades missed between two observed trade IDs.
message Gap {
  string exchange = 1;
  string symbol = 2;
  string after_id = 3;
  string before_id = 4;
  int64 missing = 5;
  int64 detected_at_unix_nano = 6;
  // Ingester instance that missed the trades.
  string source = 7;
}

// ArbVenue is one market's top of book for cross-exchange comparison.
// Prices are converted to the asset's common quote (USDT and USDC to USD).
message ArbVenue {
  string exchange = 1;
  string symbol = 2;
  string bid = 3;
  string ask = 4;
  string bid_size = 5;
  string ask_size = 6;
  // Native quote -> common quote rate the prices were converted with.
  string rate = 7;
  // Where the rate came from: "1" for the common quote itself, a market
  // (kraken:USDT-USD) or "peg" when that market has no fresh book.
  string rate_source = 8;
  string taker_fee_bps = 9;
  int64 book_time_unix_nano = 10;
}

// ArbRoute is buying on one market and selling on another at once.
message ArbRoute {
  string buy_exchange = 1;
  string buy_symbol = 2;
  string sell_exchange = 3;
  string sell_symbol = 4;
  // Best ask of the buy market, best bid of the sell market (common quote).
  string buy_price = 5;
  string sell_price = 6;
  // Top-of-book spread before and after both taker fees, in basis points.
  string gross_bps = 7;
  string net_bps = 8;
  // Base amount that can be traded while it stays profitable after fees,
  // walking both books, and the profit over it (common quote).
  string size = 9;
  string profit = 10;
}

// ArbSnapshot compares every market of one asset (e.g. BTC-USD: coinbase
// BTC-USD, kraken BTC-USD, binance BTC-USDT). Published at most every
// ~250 ms per asset; short retention.
message ArbSnapshot {
  string asset = 1;
  int64 time_unix_nano = 2;
  repeated ArbVenue venues = 3;
  // Every ordered pair of venues, best net first.
  repeated ArbRoute routes = 4;
}

// ArbWindow is one closed opportunity: a route that stayed profitable after
// fees from opened to closed. id is derived from the route and the book that
// opened it, so replicas produce the same id.
message ArbWindow {
  string id = 1;
  string asset = 2;
  string buy_exchange = 3;
  string buy_symbol = 4;
  string sell_exchange = 5;
  string sell_symbol = 6;
  int64 opened_unix_nano = 7;
  int64 closed_unix_nano = 8;
  string peak_net_bps = 9;
  string peak_gross_bps = 10;
  // Largest profitable size and its profit seen during the window.
  string peak_size = 11;
  string peak_profit = 12;
  // Evaluations (book updates) during which the window was open.
  int64 updates = 13;
}
